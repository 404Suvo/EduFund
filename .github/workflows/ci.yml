name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Install, Compile Compact & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Midnight Compact Compiler CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.compact/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          compact update 0.31.1

      - name: Verify Compact Toolchain
        run: |
          compact --version
          compact compile --version

      - name: Install Dependencies
        run: npm ci

      - name: Compile Compact Smart Contract
        run: compact compile contracts/edufund.compact managed

      - name: Run Test Suite
        run: npm test

      - name: Build Frontend Application
        run: npm run build
